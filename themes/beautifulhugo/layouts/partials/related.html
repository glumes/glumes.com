{{ $related := .Site.RegularPages.Related . | first 10 }}
{{ with $related }}
<h3>相关文章</h3>
<ul style="margin-bottom: 25px;">
    {{ range . }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
</ul>
{{ end }}


<h3>留言板</h3>

repo=glumes/glumes.com
issue-term="pathname"
theme="github-light"
crossorigin="anonymous"
async>
</script>
